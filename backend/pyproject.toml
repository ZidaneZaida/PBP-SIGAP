[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/migrations/**", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
# severity=null bermakna "sumber (BMKG) tidak memberi skala waspada/siaga/awas"
"apps/alerts/models.py" = ["DJ001"]